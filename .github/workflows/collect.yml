name: collect
on:
  push:
    branches: [main]
    paths: ["ww3monitor/**", ".github/workflows/**"]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill N days of GDELT history first (0 = none)"
        default: "0"
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Backfill
        if: ${{ github.event.inputs.backfill_days != '' && github.event.inputs.backfill_days != '0' }}
        run: python -m ww3monitor backfill --days ${{ github.event.inputs.backfill_days }}
      - name: Collect
        run: python -m ww3monitor collect
      - name: Commit data
        run: |
          git config user.name "ww3-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: collect $(date -u +%FT%TZ)"
          git push
