name: collect
on:
  push:
    branches: [main]
    paths: ["ww3monitor/**", ".github/workflows/**"]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Days of GDELT history to keep filled"
        default: "90"
      max_minutes:
        description: "Time budget for GDELT downloads this run"
        default: "45"
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # always build on the latest data, not the trigger commit
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Rescore stored headlines with current rules
        run: python -m ww3monitor rescore
      - name: Collect (GDELT event files newest-first, resumable; then RSS)
        # Scheduled runs spend up to 20 min, so the 90-day history fills over the first day or so.
        timeout-minutes: 70
        continue-on-error: true
        run: >
          python -m ww3monitor collect
          --days ${{ github.event.inputs.backfill_days || '90' }}
          --max-minutes ${{ github.event.inputs.max_minutes || '20' }}
      - name: Commit data
        if: always()
        run: |
          git config user.name "ww3-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: collect $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
