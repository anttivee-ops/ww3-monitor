name: collect
on:
  push:
    branches: [main]
    paths: ["ww3monitor/**", ".github/workflows/**"]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill N days of GDELT history first (0 = none)"
        default: "0"
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # always build on the latest data, not the trigger commit
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Backfill
        # Manual runs: the requested depth. Scheduled runs: keep filling 30 days of
        # history a little at a time (resumable, finished days are skipped).
        timeout-minutes: 60
        continue-on-error: true
        run: python -m ww3monitor backfill --days ${{ github.event.inputs.backfill_days || '30' }} --max-minutes ${{ github.event_name == 'workflow_dispatch' && '45' || '15' }}
      - name: Rescore stored events with current rules
        run: python -m ww3monitor rescore
      - name: Collect
        run: python -m ww3monitor collect
      - name: Commit data
        if: always()
        run: |
          git config user.name "ww3-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: collect $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
